<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Parking</title>
</head>
<body>
  <script>
    // Send each visitor to the right place: admins to /admin/, clients to /client/, everyone else to login.
    fetch("/api/auth/me", { credentials: "same-origin" })
      .then(r => r.ok ? r.json() : null)
      .then(u => { location.replace(!u ? "/login.html" : u.role === "ADMIN" ? "/admin/index.html" : "/client/index.html"); })
      .catch(() => { location.replace("/login.html"); });
  </script>
</body>
</html>
