spring.application.name=backend
spring.datasource.url=jdbc:h2:file:./data/parking
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
parking.total-slots=2

# ---- sign-in ----
# The administrator account is created on first start if it does not exist yet.
# CHANGE THE PASSWORD BEFORE FIRST RUN. Only a salted hash is stored in the database.
parking.admin.username=admin
parking.admin.password=admin123
# Forgot the password? Set to true for one run to force the password above onto the account, then set back to false.
parking.admin.reset-password=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
